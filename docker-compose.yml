services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_WAITLIST_URL: ${NEXT_PUBLIC_WAITLIST_URL}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
      NEXT_PUBLIC_WAITLIST_URL: ${NEXT_PUBLIC_WAITLIST_URL}
    restart: unless-stopped
